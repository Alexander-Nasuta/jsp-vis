[tox]
minversion = 4.0
envlist = py310, py311, py312, py313
isolated_build = true

[gh-actions]
python =
    3.10: py310
    3.11: py311
    3.12: py312
    3.13: py313

# NOTE!!: https://github.com/tox-dev/tox/issues/149
[testenv]
setenv =
    PYTHONPATH = {toxinidir}
# install the package with its dev extras (unpinned) so every Python version
# resolves compatible dependency versions; requirements*.txt are pinned for 3.13
extras =
    dev
commands =
    pytest --basetemp={envtmpdir}
